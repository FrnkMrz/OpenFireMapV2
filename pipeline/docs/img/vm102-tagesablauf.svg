<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img">
<title>Tagesablauf der VM 102</title>
<desc>Über 24 Stunden läuft nginx durchgehend. Der Builder-Container startet nur um 05:43 UTC für etwa zwölf Minuten und ist danach weg. Darunter die vier Schritte des Laufs.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:14px;font-weight:500}.s{font-size:12px}
.gh{fill:#444441}.gs{fill:#5F5E5A}.ch{fill:#712B13}.cs{fill:#993C1D}
.g{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}.tl{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.co{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="310" fill="#FFFFFF"/>

<text class="s gs" x="40" y="36" text-anchor="middle">00:00</text>
<text class="s gs" x="190" y="36" text-anchor="middle">06:00</text>
<text class="s gs" x="340" y="36" text-anchor="middle">12:00</text>
<text class="s gs" x="490" y="36" text-anchor="middle">18:00</text>
<text class="s gs" x="640" y="36" text-anchor="middle">24:00 UTC</text>
<line class="leader" x1="40" y1="42" x2="640" y2="42"/>

<text class="h gh" x="40" y="72">nginx</text>
<text class="s gs" x="92" y="72">läuft den ganzen Tag</text>
<rect class="tl" x="40" y="80" width="600" height="22" rx="4"/>

<text class="h gh" x="40" y="132">Builder</text>
<text class="s gs" x="108" y="132">läuft nur kurz</text>
<rect class="g" x="40" y="140" width="600" height="22" rx="4"/>
<text class="s gs" x="215" y="156">danach Ruhe bis morgen 05:43</text>
<rect class="co" x="182" y="140" width="7" height="22" rx="2"/>

<line class="leader" x1="186" y1="164" x2="186" y2="188"/>
<text class="s gs" x="40" y="196">So sieht der Lauf von 05:43 bis 05:55 aus (rund zwölf Minuten):</text>

<rect class="co" x="40" y="208" width="135" height="64" rx="8"/>
<text class="h ch" x="107" y="232" text-anchor="middle">05:43 Start</text>
<text class="s cs" x="107" y="252" text-anchor="middle">Cron startet Builder</text>
<rect class="co" x="195" y="208" width="135" height="64" rx="8"/>
<text class="h ch" x="262" y="232" text-anchor="middle">Download</text>
<text class="s cs" x="262" y="252" text-anchor="middle">OSM-Daten, 1,5 Min</text>
<rect class="co" x="350" y="208" width="135" height="64" rx="8"/>
<text class="h ch" x="417" y="232" text-anchor="middle">Bau</text>
<text class="s cs" x="417" y="252" text-anchor="middle">Kacheln, ca. 10 Min</text>
<rect class="co" x="505" y="208" width="135" height="64" rx="8"/>
<text class="h ch" x="572" y="232" text-anchor="middle">05:55 Upload</text>
<text class="s cs" x="572" y="252" text-anchor="middle">nach R2, dann Ende</text>
<line class="arr" x1="175" y1="240" x2="193" y2="240" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="240" x2="348" y2="240" marker-end="url(#arrow)"/>
<line class="arr" x1="485" y1="240" x2="503" y2="240" marker-end="url(#arrow)"/>
</svg>
