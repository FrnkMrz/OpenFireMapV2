server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html metadata.json;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/geo+json text/plain application/javascript text/css;
    gzip_min_length 256;

    types {
        text/html html htm;
        application/json json;
        application/geo+json geojson;
        application/vnd.pmtiles pmtiles;
    }

    etag on;

    # PMTiles Vektorkacheln:
    # WICHTIG: gzip MUSS deaktiviert sein, damit HTTP-Byte-Range-Requests (206 Partial Content)
    # in allen Browsern (insbesondere Safari/WebKit) einwandfrei und ohne Header-Kollisionen funktionieren!
    location ~* \.pmtiles$ {
        gzip off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        try_files $uri =404;
    }

    location / {
        # CORS Header
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        autoindex off;

        try_files $uri $uri/ =404;
    }

    # Interner Status-Endpunkt: Nur im lokalen Netzwerk (LAN / RFC1918) verfügbar.
    # Liefert ausschließlich system_stats.json und sync_status.json aus.
    location /internal/ {
        # Defense-in-Depth: Schutz gegen Zugriff über künftige Reverse-Proxy- oder Tunnel-Konfigurationen.
        # Anfragen über Cloudflare Edge / cloudflared tragen stets den Header CF-Connecting-IP.
        # Da ein Tunnel-Container aus Sicht von nginx eine interne Docker-IP besitzt,
        # würde eine reine IP-Prüfung diesen Traffic durchlassen. Der Schutz bleibt daher dauerhaft aktiv.
        if ($http_cf_connecting_ip) {
            return 403 "Forbidden: Internal status is not accessible via public tunnel.\n";
        }

        # Nur RFC1918-Netzwerkbereiche und localhost zulassen
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        alias /usr/share/nginx/internal/;
        autoindex off;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        try_files $uri =404;
    }

    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
