services:
  web:
    image: nginx:alpine
    container_name: openfiremap-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/publish:/usr/share/nginx/html:ro
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/raw/system_stats.json:/usr/share/nginx/internal/system_stats.json:ro
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/raw/sync_status.json:/usr/share/nginx/internal/sync_status.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  builder:
    build:
      context: ./builder
      dockerfile: Dockerfile
    container_name: openfiremap-builder
    shm_size: "2gb"
    volumes:
      - ./builder/build_features.py:/app/build_features.py:ro
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/raw:/data/raw
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/publish:/data/publish
    environment:
      - PIPELINE_REGION=${PIPELINE_REGION:-dachlilu}
      - OSM_EXTRACT_URL=${OSM_EXTRACT_URL:-}
      - FORCE_DOWNLOAD=${FORCE_DOWNLOAD:-false}
      - FORCE_BUILD=${FORCE_BUILD:-false}
      # Download-Feinsteuerung (optional, aus Shell oder .env); ungesetzt gelten die Standardwerte im Builder
      - CURL_MAX_TIME
      - CURL_SPEED_LIMIT
      - CURL_SPEED_TIME
      - CURL_ATTEMPTS
      - CURL_RETRY_DELAY
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

