services:
  web:
    image: nginx:alpine
    container_name: openfiremap-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/publish:/usr/share/nginx/html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  builder:
    build:
      context: ./builder
      dockerfile: Dockerfile
    container_name: openfiremap-builder
    volumes:
      - ./builder/build_features.py:/app/build_features.py:ro
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/raw:/data/raw
      - ${DATA_PATH:-/srv/docker/data/openfiremap}/publish:/data/publish
    environment:
      - OSM_EXTRACT_URL=${OSM_EXTRACT_URL:-https://download.geofabrik.de/europe/germany/bayern/mittelfranken-latest.osm.pbf}
      - FORCE_DOWNLOAD=${FORCE_DOWNLOAD:-false}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: openfiremap-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
