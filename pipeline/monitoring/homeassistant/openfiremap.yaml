# ==============================================================================
# OpenFireMap DACHLiLu Pipeline - Home Assistant Monitoring Package
# ==============================================================================
# Überwacht den öffentlichen Datenstand (Cloudflare R2), den lokalen Stand auf
# VM 102, den R2-Sync (sync_status.json) und den Speicher der VM.
#
# Einbindung:
#   1. Datei nach /config/packages/openfiremap.yaml kopieren; Packages müssen in
#      /config/configuration.yaml aktiviert sein:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Platzhalter ersetzen (Home Assistant kennt kein !secret in Dienstnamen
#      oder innerhalb von Zeichenketten, daher direkt eintragen):
#        <PIPELINE_PUBLIC_URL> -> https://pipeline.openfiremap.org
#        <PIPELINE_LAN_URL>    -> http://<LAN-IP der VM>:8080
#        <PIPELINE_SSH_TARGET> -> <benutzer>@<LAN-IP der VM> (SSH-Forced-Command, s. u.)
#        <NOTIFY_SERVICE>      -> z. B. notify.mobile_app_<geraet>
#   3. Speicherwerte: system_stats.json bleibt absichtlich nicht öffentlich. Die
#      command_line-Sensoren lesen sie per SSH mit eingeschränktem Schlüssel
#      (/config/.ssh/openfiremap_stats), der auf der VM nur das Skript
#      pipeline/monitoring/openfiremap-stats ausführen darf (Einrichtung siehe
#      pipeline/docs/DOKUMENTATION.md).
#   4. Konfiguration prüfen und neu laden. Prüfen der Entitäts-IDs:
#        python3 pipeline/tools/check_ha_entities.py pipeline/monitoring/homeassistant/openfiremap.yaml
#
# Entitäts-IDs: Andere Automationen und Dashboards nutzen feste IDs wie
# sensor.openfiremap_hydrants. REST- und command_line-Sensoren bilden ihre ID
# aus `name`, deshalb sind diese Namen englisch; die deutschen Anzeigenamen
# setzt `homeassistant: customize` am Ende. Template-Entitäten legen ihre ID
# mit `default_entity_id` fest.
#
# Schwellenwerte:
# - Statusfehler: 30 Minuten dauerhaft
# - Erreichbarkeit: 60 Minuten dauerhaft
# - Heartbeat fehlt: 30 Stunden seit letzter Sync-Prüfung
# - Publish-Verzug: input_number.openfiremap_publish_lag_limit (Standard 360 min)
# - Objekt-Einbruch: input_number.openfiremap_count_drop_percent (Standard 90 %)
# - Build zu lang: input_number.openfiremap_build_duration_limit (Standard 3600 s)
# - Speicher knapp: input_number.openfiremap_disk_free_limit (Standard 20 GB)
#
# Hinweis: Die Sensoren aus sync_status.json sind bis zum ersten Lauf von
# update.sh 'unavailable'; die Datei entsteht erst dabei.
# ==============================================================================

input_number:
  openfiremap_publish_lag_limit:
    name: OpenFireMap Publish-Verzug Schwelle
    min: 60
    max: 1440
    step: 60
    initial: 360
    unit_of_measurement: min
    mode: box

  openfiremap_count_drop_percent:
    name: OpenFireMap Objektbestand Minimum
    min: 50
    max: 99
    step: 1
    initial: 90
    unit_of_measurement: "%"
    mode: slider

  openfiremap_build_duration_limit:
    name: OpenFireMap Build-Dauer Schwelle
    min: 60
    max: 7200
    step: 60
    initial: 3600
    unit_of_measurement: s
    mode: box

  openfiremap_disk_free_limit:
    name: OpenFireMap Speichergrenze
    min: 1
    max: 200
    step: 1
    initial: 20
    unit_of_measurement: GB
    mode: box

input_text:
  openfiremap_current_region:
    name: OpenFireMap aktuelle Region
    max: 64
    icon: mdi:map-marker

  openfiremap_previous_region:
    name: OpenFireMap vorherige Region
    max: 64
    icon: mdi:map-marker-outline

rest:
  - resource: "<PIPELINE_PUBLIC_URL>/metadata.json"
    scan_interval: 900
    sensor:
      - name: "OpenFireMap Status"
        unique_id: openfiremap_status
        value_template: "{{ value_json.status | default('error') }}"
        icon: mdi:map-marker-check
        json_attributes:
          - summary
          - generated_at
          - region
          - countries
          - source_extract
          - source_extract_size_mb
          - source_url
          - pmtiles
          - timings

      # Bei HTTP-Timeout/Fehler wird die REST-Entität von HA unavailable.
      # Bei HTTP 200 mit status != ok liefert dieser Sensor 0.
      - name: "OpenFireMap Reachable"
        unique_id: openfiremap_reachable
        value_template: "{{ 1 if value_json.status | default('') == 'ok' else 0 }}"
        icon: mdi:check-network

      - name: "OpenFireMap Summary"
        unique_id: openfiremap_summary
        value_template: "{{ value_json.summary | default('Nicht erreichbar') }}"
        icon: mdi:information-outline

      - name: "OpenFireMap Last Update"
        unique_id: openfiremap_last_update
        value_template: "{{ value_json.generated_at | default(none) }}"
        device_class: timestamp
        icon: mdi:clock-check-outline

      - name: "OpenFireMap Hydrants"
        unique_id: openfiremap_hydrants
        value_template: "{{ value_json.features.hydrants.count }}"
        unit_of_measurement: "Hydranten"
        icon: mdi:fire-hydrant
        state_class: measurement
        json_attributes_path: "$.features.hydrants"
        json_attributes:
          - diff_text
          - previous_count
          - duration_sec

      - name: "OpenFireMap Fire Stations"
        unique_id: openfiremap_fire_stations
        value_template: "{{ value_json.features.fire_stations.count }}"
        unit_of_measurement: "Wachen"
        icon: mdi:fire-station
        state_class: measurement
        json_attributes_path: "$.features.fire_stations"
        json_attributes:
          - diff_text
          - previous_count
          - duration_sec

      - name: "OpenFireMap Water Points"
        unique_id: openfiremap_water_points
        value_template: "{{ value_json.features.water_points.count }}"
        unit_of_measurement: "Wasserstellen"
        icon: mdi:water-pump
        state_class: measurement
        json_attributes_path: "$.features.water_points"
        json_attributes:
          - diff_text
          - previous_count
          - duration_sec

      - name: "OpenFireMap Defibrillators"
        unique_id: openfiremap_defibrillators
        value_template: "{{ value_json.features.defibrillators.count }}"
        unit_of_measurement: "Defibrillatoren"
        icon: mdi:heart-pulse
        state_class: measurement
        json_attributes_path: "$.features.defibrillators"
        json_attributes:
          - diff_text
          - previous_count
          - duration_sec

      - name: "OpenFireMap Boundaries"
        unique_id: openfiremap_boundaries
        value_template: "{{ value_json.features.boundaries.count }}"
        unit_of_measurement: "Grenzen"
        icon: mdi:map-marker-path
        state_class: measurement
        json_attributes_path: "$.features.boundaries"
        json_attributes:
          - diff_text
          - previous_count
          - duration_sec

      - name: "OpenFireMap Build Duration"
        unique_id: openfiremap_build_duration
        value_template: "{{ value_json.timings.total_sec }}"
        unit_of_measurement: "s"
        device_class: duration
        icon: mdi:timer-outline
        state_class: measurement

      - name: "OpenFireMap Download Duration"
        unique_id: openfiremap_download_duration
        value_template: "{{ value_json.timings.download_sec }}"
        unit_of_measurement: "s"
        device_class: duration
        icon: mdi:download
        state_class: measurement

      - name: "OpenFireMap Extraction Duration"
        unique_id: openfiremap_extraction_duration
        value_template: "{{ value_json.timings.extraction_sec }}"
        unit_of_measurement: "s"
        device_class: duration
        icon: mdi:database-arrow-down
        state_class: measurement

      - name: "OpenFireMap PMTiles Size"
        unique_id: openfiremap_pmtiles_size
        value_template: "{{ value_json.pmtiles.size_mb }}"
        unit_of_measurement: "MB"
        device_class: data_size
        icon: mdi:map
        state_class: measurement

      - name: "OpenFireMap PMTiles Duration"
        unique_id: openfiremap_pmtiles_duration
        value_template: "{{ value_json.pmtiles.duration_sec }}"
        unit_of_measurement: "s"
        device_class: duration
        icon: mdi:map-clock
        state_class: measurement

  - resource: "<PIPELINE_LAN_URL>/metadata.json"
    scan_interval: 900
    sensor:
      - name: "OpenFireMap Local Status"
        unique_id: openfiremap_local_status
        value_template: "{{ value_json.status | default('offline') }}"
        icon: mdi:lan-connect
        json_attributes:
          - generated_at
          - region
          - countries

      - name: "OpenFireMap Local Last Update"
        unique_id: openfiremap_local_last_update
        value_template: "{{ value_json.generated_at | default(none) }}"
        device_class: timestamp
        icon: mdi:clock-check-outline

  - resource: "<PIPELINE_LAN_URL>/internal/sync_status.json"
    scan_interval: 900
    sensor:
      - name: "OpenFireMap Sync Letzter Fehler"
        unique_id: openfiremap_sync_last_error
        value_template: "{{ value_json.last_error | default('Kein Fehler') }}"
        icon: mdi:alert-circle-outline

      - name: "OpenFireMap Sync Letzte Prüfung"
        unique_id: openfiremap_sync_checked_at
        value_template: "{{ value_json.checked_at | default('unknown') }}"
        icon: mdi:calendar-clock

      - name: "OpenFireMap Sync Ergebnis"
        unique_id: openfiremap_sync_result
        value_template: "{{ value_json.result | default('unknown') }}"
        icon: mdi:check-decagram

    binary_sensor:
      - name: "OpenFireMap Upload Erfolgreich"
        unique_id: openfiremap_sync_upload_ok
        value_template: "{{ value_json.upload_ok | default(false) }}"
        device_class: problem

      - name: "OpenFireMap In Sync"
        unique_id: openfiremap_sync_in_sync
        value_template: "{{ value_json.in_sync | default(false) }}"
        device_class: connectivity

command_line:
  - sensor:
      name: "OpenFireMap Disk Free"
      unique_id: openfiremap_disk_free
      command: >-
        /usr/bin/ssh -i /config/.ssh/openfiremap_stats
        -o BatchMode=yes
        -o IdentitiesOnly=yes
        -o UserKnownHostsFile=/config/.ssh/known_hosts
        -o StrictHostKeyChecking=yes
        -o ConnectTimeout=10
        <PIPELINE_SSH_TARGET>
      command_timeout: 20
      scan_interval: 900
      value_template: "{{ value_json.disk_free_gb }}"
      unit_of_measurement: "GB"
      device_class: data_size
      state_class: measurement
      json_attributes:
        - disk_used_gb
        - disk_total_gb
        - disk_used_percent
        - checked_at
        - generated_at
        - timestamp
        - system

  - sensor:
      name: "OpenFireMap Disk Usage"
      unique_id: openfiremap_disk_usage
      command: >-
        /usr/bin/ssh -i /config/.ssh/openfiremap_stats
        -o BatchMode=yes
        -o IdentitiesOnly=yes
        -o UserKnownHostsFile=/config/.ssh/known_hosts
        -o StrictHostKeyChecking=yes
        -o ConnectTimeout=10
        <PIPELINE_SSH_TARGET>
      command_timeout: 20
      scan_interval: 900
      value_template: "{{ value_json.disk_used_percent }}"
      unit_of_measurement: "%"
      device_class: power_factor
      icon: mdi:chart-pie
      state_class: measurement
      json_attributes:
        - disk_free_gb
        - disk_used_gb
        - disk_total_gb
        - checked_at
        - generated_at
        - timestamp
        - system

template:
  - sensor:
      - name: "OpenFireMap Publish-Verzug"
        unique_id: openfiremap_publish_lag
        default_entity_id: sensor.openfiremap_publish_lag
        availability: >-
          {{ states('sensor.openfiremap_last_update') not in
             ['unknown', 'unavailable', 'none', ''] and
             states('sensor.openfiremap_local_last_update') not in
             ['unknown', 'unavailable', 'none', ''] }}
        state: >-
          {% set public_ts = as_timestamp(states('sensor.openfiremap_last_update'), 0) %}
          {% set local_ts = as_timestamp(states('sensor.openfiremap_local_last_update'), 0) %}
          {{ [0, ((local_ts - public_ts) / 60)] | max | round(1) }}
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timelapse

      - name: "OpenFireMap Sync Alter Stunden"
        unique_id: openfiremap_sync_age_hours
        default_entity_id: sensor.openfiremap_sync_alter_stunden
        availability: >-
          {{ states('sensor.openfiremap_sync_letzte_prufung') not in
             ['unknown', 'unavailable', 'none', ''] }}
        state: >-
          {{ ((as_timestamp(now()) -
              as_timestamp(states('sensor.openfiremap_sync_letzte_prufung'))) / 3600) | round(1) }}
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:heart-pulse

  - triggers:
      - trigger: state
        entity_id:
          - sensor.openfiremap_status
          - sensor.openfiremap_reachable
          - sensor.openfiremap_last_update
          - sensor.openfiremap_publish_lag
          - sensor.openfiremap_hydrants
          - sensor.openfiremap_fire_stations
          - sensor.openfiremap_water_points
          - sensor.openfiremap_defibrillators
          - sensor.openfiremap_boundaries
          - sensor.openfiremap_build_duration
          - sensor.openfiremap_disk_free
          - sensor.openfiremap_disk_usage
          - sensor.openfiremap_local_status
          - input_number.openfiremap_publish_lag_limit
          - input_number.openfiremap_count_drop_percent
          - input_number.openfiremap_build_duration_limit
          - input_number.openfiremap_disk_free_limit
          - input_text.openfiremap_current_region
          - input_text.openfiremap_previous_region
      - trigger: time_pattern
        minutes: "/5"
    binary_sensor:
      - name: "OpenFireMap Warnung Status"
        unique_id: openfiremap_status_problem
        default_entity_id: binary_sensor.openfiremap_status_problem
        state: >-
          {{ states('sensor.openfiremap_status') not in
             ['ok', 'unknown', 'unavailable', 'none', ''] }}
        delay_on: "00:30:00"
        delay_off: "00:05:00"
        icon: mdi:alert-circle

      - name: "OpenFireMap Warnung Öffentlicher Endpunkt"
        unique_id: openfiremap_endpoint_problem
        default_entity_id: binary_sensor.openfiremap_endpoint_problem
        state: >-
          {{ states('sensor.openfiremap_reachable') in
             ['0', 'unknown', 'unavailable', 'none', ''] }}
        delay_on: "01:00:00"
        delay_off: "00:00:00"
        icon: mdi:cloud-alert

      - name: "OpenFireMap Warnung Publish-Verzug"
        unique_id: openfiremap_publish_lag_problem
        default_entity_id: binary_sensor.openfiremap_publish_lag_problem
        state: >-
          {{ states('sensor.openfiremap_publish_lag') not in
             ['unknown', 'unavailable', 'none', ''] and
             states('sensor.openfiremap_publish_lag') | float(0) >
             states('input_number.openfiremap_publish_lag_limit') | float(360) }}
        icon: mdi:timer-alert

      - name: "OpenFireMap Warnung Objektbestand"
        unique_id: openfiremap_count_drop
        default_entity_id: binary_sensor.openfiremap_count_drop
        state: >-
          {% set current_region = states('input_text.openfiremap_current_region') %}
          {% set previous_region = states('input_text.openfiremap_previous_region') %}
          {% set minimum = states('input_number.openfiremap_count_drop_percent') | float(90) / 100 %}
          {% set ns = namespace(drop=false) %}
          {% if current_region not in ['unknown', 'unavailable', 'none', ''] and
                current_region == previous_region %}
            {% for entity_id in [
              'sensor.openfiremap_hydrants',
              'sensor.openfiremap_fire_stations',
              'sensor.openfiremap_water_points',
              'sensor.openfiremap_defibrillators',
              'sensor.openfiremap_boundaries'
            ] %}
              {% set current = states(entity_id) %}
              {% set previous = state_attr(entity_id, 'previous_count') %}
              {% if current not in ['unknown', 'unavailable', 'none', ''] and previous is not none %}
                {% if current | float < previous | float * minimum %}
                  {% set ns.drop = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.drop }}
        icon: mdi:chart-line-variant
        attributes:
          details: >-
            {% set current_region = states('input_text.openfiremap_current_region') %}
            {% set previous_region = states('input_text.openfiremap_previous_region') %}
            {% set minimum = states('input_number.openfiremap_count_drop_percent') | float(90) / 100 %}
            {% set ns = namespace(items=[]) %}
            {% if current_region == previous_region %}
              {% for label, entity_id in [
                ('Hydranten', 'sensor.openfiremap_hydrants'),
                ('Wachen', 'sensor.openfiremap_fire_stations'),
                ('Wasserstellen', 'sensor.openfiremap_water_points'),
                ('Defis', 'sensor.openfiremap_defibrillators'),
                ('Grenzen', 'sensor.openfiremap_boundaries')
              ] %}
                {% set current = states(entity_id) %}
                {% set previous = state_attr(entity_id, 'previous_count') %}
                {% if current not in ['unknown', 'unavailable', 'none', ''] and previous is not none and current | float < previous | float * minimum %}
                  {% set change = (((current | float - previous | float) / previous | float) * 100) | round(1) %}
                  {% set ns.items = ns.items + [label ~ ' ' ~ current ~ ' → ' ~ (change | string) ~ ' %'] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.items | join('; ') if ns.items else 'kein Einbruch' }}

      - name: "OpenFireMap Warnung Build-Dauer"
        unique_id: openfiremap_build_too_long
        default_entity_id: binary_sensor.openfiremap_build_too_long
        state: >-
          {{ states('sensor.openfiremap_build_duration') not in
             ['unknown', 'unavailable', 'none', ''] and
             states('sensor.openfiremap_build_duration') | float(0) >
             states('input_number.openfiremap_build_duration_limit') | float(3600) }}
        icon: mdi:timer-alert-outline

      - name: "OpenFireMap Local Endpoint Problem"
        unique_id: openfiremap_local_endpoint_problem
        default_entity_id: binary_sensor.openfiremap_local_endpoint_problem
        state: >-
          {{ states('sensor.openfiremap_local_status') != 'ok' }}
        delay_on: "01:00:00"
        delay_off: "00:00:00"
        icon: mdi:lan-disconnect

      - name: "OpenFireMap SSH Stats Problem"
        unique_id: openfiremap_ssh_stats_problem
        default_entity_id: binary_sensor.openfiremap_ssh_stats_problem
        state: >-
          {{ states('sensor.openfiremap_disk_free') in
             ['unknown', 'unavailable', 'none', ''] or
             states('sensor.openfiremap_disk_usage') in
             ['unknown', 'unavailable', 'none', ''] }}
        delay_on: "01:00:00"
        delay_off: "00:00:00"
        icon: mdi:ssh

      - name: "OpenFireMap Disk Low"
        unique_id: openfiremap_disk_low
        default_entity_id: binary_sensor.openfiremap_disk_low
        state: >-
          {{ states('sensor.openfiremap_disk_free') not in
             ['unknown', 'unavailable', 'none', ''] and
             states('sensor.openfiremap_disk_free') | float(0) <
             states('input_number.openfiremap_disk_free_limit') | float(20) }}
        delay_on: "00:30:00"
        delay_off: "00:00:00"
        icon: mdi:harddisk-alert

automation:
  - id: openfiremap_heartbeat_missing
    alias: "OpenFireMap Heartbeat Missing"
    description: "Meldet, wenn seit mehr als 30 Stunden kein Update-Lauf geprüft wurde."
    triggers:
      - trigger: numeric_state
        entity_id: sensor.openfiremap_sync_alter_stunden
        above: 30
    actions:
      - action: <NOTIFY_SERVICE>
        data:
          title: "OpenFireMap Pipeline Heartbeat fehlt"
          message: >-
            Auf der Pipeline-VM wurde seit über 30 Stunden kein Update-Lauf geprüft
            (Alter: {{ states('sensor.openfiremap_sync_alter_stunden') }} h).
            Letzte Prüfung: {{ states('sensor.openfiremap_sync_letzte_prufung') }}.
            Ergebnis: {{ states('sensor.openfiremap_sync_ergebnis') }}.
    mode: single

  - id: openfiremap_sync_mismatch
    alias: "OpenFireMap: Sync-Diskrepanz oder Upload-Fehler"
    description: "Meldet explizite Upload-Fehler oder eine anhaltende Sync-Diskrepanz."
    triggers:
      - trigger: state
        entity_id: binary_sensor.openfiremap_in_sync
        from: "on"
        to: "off"
        for: "02:00:00"
      - trigger: state
        entity_id: binary_sensor.openfiremap_upload_erfolgreich
        from: "on"
        to: "off"
        for: "00:15:00"
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.openfiremap_last_update') not in
             ['unknown', 'unavailable', 'none', ''] and
             states('sensor.openfiremap_local_last_update') not in
             ['unknown', 'unavailable', 'none', ''] }}
    actions:
      - action: <NOTIFY_SERVICE>
        data:
          title: "OpenFireMap Sync-Fehler"
          message: >-
            Sync-Status der Pipeline auffällig: Ergebnis={{ states('sensor.openfiremap_sync_ergebnis') }},
            Upload={{ states('binary_sensor.openfiremap_upload_erfolgreich') }},
            In Sync={{ states('binary_sensor.openfiremap_in_sync') }}.
            Letzter Fehler: {{ states('sensor.openfiremap_sync_letzter_fehler') }}
    mode: single

  - id: openfiremap_region_bookkeeping
    alias: "OpenFireMap Region merken"
    description: "Merkt die aktuelle und vorherige Pipeline-Region für die Bestandsprüfung."
    triggers:
      - trigger: state
        entity_id: sensor.openfiremap_last_update
        id: build
      - trigger: homeassistant
        event: start
        id: startup
    conditions:
      - condition: template
        value_template: >-
          {{ state_attr('sensor.openfiremap_status', 'region') not in
             [none, '', 'unknown', 'unavailable'] }}
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: build
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.openfiremap_previous_region
                data:
                  value: "{{ states('input_text.openfiremap_current_region') }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.openfiremap_current_region
                data:
                  value: "{{ state_attr('sensor.openfiremap_status', 'region') }}"
          - conditions:
              - condition: trigger
                id: startup
              - condition: template
                value_template: >-
                  {{ states('input_text.openfiremap_current_region') in
                     ['unknown', 'unavailable', 'none', ''] }}
            sequence:
              - action: input_text.set_value
                target:
                  entity_id:
                    - input_text.openfiremap_current_region
                    - input_text.openfiremap_previous_region
                data:
                  value: "{{ state_attr('sensor.openfiremap_status', 'region') }}"
    mode: queued

  - id: openfiremap_monitoring_alerts
    alias: "OpenFireMap Monitoring-Warnungen"
    description: "Meldet Eintritt und Entwarnung für die OpenFireMap-Überwachung."
    triggers:
      - trigger: state
        entity_id: binary_sensor.openfiremap_status_problem
        from: "off"
        to: "on"
        id: status_problem
      - trigger: state
        entity_id: binary_sensor.openfiremap_endpoint_problem
        from: "off"
        to: "on"
        id: endpoint_problem
      - trigger: state
        entity_id: binary_sensor.openfiremap_publish_lag_problem
        from: "off"
        to: "on"
        id: publish_lag
      - trigger: state
        entity_id: binary_sensor.openfiremap_count_drop
        from: "off"
        to: "on"
        id: count_drop
      - trigger: state
        entity_id: binary_sensor.openfiremap_build_too_long
        from: "off"
        to: "on"
        id: build_too_long
      - trigger: state
        entity_id: binary_sensor.openfiremap_local_endpoint_problem
        from: "off"
        to: "on"
        id: local_endpoint_problem
      - trigger: state
        entity_id: binary_sensor.openfiremap_ssh_stats_problem
        from: "off"
        to: "on"
        id: ssh_stats_problem
      - trigger: state
        entity_id: binary_sensor.openfiremap_disk_low
        from: "off"
        to: "on"
        id: disk_low
      - trigger: state
        entity_id: binary_sensor.openfiremap_status_problem
        from: "on"
        to: "off"
        id: status_recovered
      - trigger: state
        entity_id: binary_sensor.openfiremap_endpoint_problem
        from: "on"
        to: "off"
        id: endpoint_recovered
      - trigger: state
        entity_id: binary_sensor.openfiremap_publish_lag_problem
        from: "on"
        to: "off"
        id: publish_lag_recovered
      - trigger: state
        entity_id: binary_sensor.openfiremap_count_drop
        from: "on"
        to: "off"
        id: count_drop_recovered
      - trigger: state
        entity_id: binary_sensor.openfiremap_build_too_long
        from: "on"
        to: "off"
        id: build_too_long_recovered
      - trigger: state
        entity_id: binary_sensor.openfiremap_local_endpoint_problem
        from: "on"
        to: "off"
        id: local_endpoint_recovered
      - trigger: state
        entity_id: binary_sensor.openfiremap_ssh_stats_problem
        from: "on"
        to: "off"
        id: ssh_stats_recovered
      - trigger: state
        entity_id: binary_sensor.openfiremap_disk_low
        from: "on"
        to: "off"
        id: disk_low_recovered
    actions:
      - action: <NOTIFY_SERVICE>
        data:
          title: >-
            {{ 'OpenFireMap-Warnung' if trigger.to_state.state == 'on'
               else 'OpenFireMap-Entwarnung' }}
          message: >-
            {% set problem = {
              'status_problem': 'Status nicht ok',
              'endpoint_problem': 'öffentlicher Endpunkt nicht erreichbar',
              'publish_lag': 'Publish-Verzug zu groß',
              'count_drop': 'Objektbestand eingebrochen',
              'build_too_long': 'Build-Dauer zu lang',
              'local_endpoint_problem': 'Lokaler Endpunkt nicht erreichbar',
              'ssh_stats_problem': 'SSH-Stats der Pipeline-VM nicht erreichbar',
              'disk_low': 'Speicher auf der Pipeline-VM knapp',
              'status_recovered': 'Statusproblem',
              'endpoint_recovered': 'Endpunktproblem',
              'publish_lag_recovered': 'Publish-Verzug',
              'count_drop_recovered': 'Objektbestand-Einbruch',
              'build_too_long_recovered': 'Build-Dauer',
              'local_endpoint_recovered': 'Lokaler Endpunkt',
              'ssh_stats_recovered': 'SSH-Stats der Pipeline-VM',
              'disk_low_recovered': 'Speicherwarnung'
            }.get(trigger.id, trigger.id) %}
            {% if trigger.to_state.state == 'on' %}
              {% if trigger.id == 'status_problem' %}
                {{ problem }}: Status={{ states('sensor.openfiremap_status') }}, Region={{ state_attr('sensor.openfiremap_status', 'region') }}.
              {% elif trigger.id == 'endpoint_problem' %}
                {{ problem }}: Erreichbarkeit={{ states('sensor.openfiremap_reachable') }}.
              {% elif trigger.id == 'publish_lag' %}
                {{ problem }}: lokaler Stand={{ states('sensor.openfiremap_local_last_update') }}, öffentlicher Stand={{ states('sensor.openfiremap_last_update') }}, Verzug={{ states('sensor.openfiremap_publish_lag') }} min.
              {% elif trigger.id == 'count_drop' %}
                {{ problem }}: {{ state_attr('binary_sensor.openfiremap_count_drop', 'details') }}.
              {% elif trigger.id == 'build_too_long' %}
                {{ problem }}: Build-Dauer={{ states('sensor.openfiremap_build_duration') }} s, Schwelle={{ states('input_number.openfiremap_build_duration_limit') }} s.
              {% elif trigger.id == 'local_endpoint_problem' %}
                {{ problem }}: lokaler Status={{ states('sensor.openfiremap_local_status') }}.
              {% elif trigger.id == 'ssh_stats_problem' %}
                {{ problem }}: Speicher frei={{ states('sensor.openfiremap_disk_free') }} GB, Speicherauslastung={{ states('sensor.openfiremap_disk_usage') }} %.
              {% elif trigger.id == 'disk_low' %}
                {{ problem }}: frei={{ states('sensor.openfiremap_disk_free') }} GB, Schwelle={{ states('input_number.openfiremap_disk_free_limit') }} GB.
              {% endif %}
            {% else %}
              Behoben: {{ problem }}. Status={{ states('sensor.openfiremap_status') }}, letztes Update={{ states('sensor.openfiremap_last_update') }}.
            {% endif %}
    mode: queued

