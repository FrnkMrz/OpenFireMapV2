  <rect x="90" y="90" width="945" height="720" rx="10" fill="#fff"/>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-weight="500" fill="#111">
    <text x="296" y="285" font-size="252" textLength="542" lengthAdjust="spacingAndGlyphs">H 100</text>
