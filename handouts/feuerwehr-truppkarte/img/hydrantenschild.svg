<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 900" role="img" aria-label="Hinweisschild: H 100, darunter ein T-förmiger Strich, rechts neben dem senkrechten Strich 12,7, darunter 6,4">
  <!-- Hinweisschild für einen Unterflurhydranten nach DIN 4066 (wie auf der Hilfe-Startseite, Vorlage: Foto H 100) -->
