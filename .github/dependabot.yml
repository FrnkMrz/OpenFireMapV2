# Dependabot: wöchentliche Versions-Updates, gebündelt, damit nicht jedes Paket einen eigenen PR erzeugt.
# Sicherheitsupdates (Repo-Einstellung "Dependabot security updates") kommen unabhängig davon sofort.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # vitest und @vitest/* haben exakte Peer-Abhängigkeiten aufeinander: nur gemeinsam aktualisierbar,
      # auch bei Major-Versionen (einzelne PRs scheitern bei npm ci mit ERESOLVE).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # tailwindcss und @tailwindcss/vite erscheinen in gleicher Version: nur gemeinsam aktualisieren.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
