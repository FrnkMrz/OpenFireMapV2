<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aktuelle Software-Version, Veröffentlichungen und Änderungsprotokoll von OpenFireMap.org.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self';">
    <title>Software-Versionen · OpenFireMap.org</title>
    <link rel="stylesheet" href="../src/input.css">
</head>
<body class="version-page min-h-screen text-slate-100">
    <main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 sm:py-10">
        <header class="mb-10 flex flex-wrap items-center justify-between gap-4">
            <a href="/" class="inline-flex items-center gap-2 rounded-lg text-sm font-semibold text-slate-200 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                <span aria-hidden="true">←</span>
                <span data-i18n="skip_to_map">Zur Karte</span>
            </a>
            <label class="flex items-center gap-2 text-sm text-slate-300">
                <span data-i18n="symbols_language">Sprache</span>
                <select id="version-language" class="rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="ar">العربية</option><option value="bn">বাংলা</option><option value="cs">Čeština</option>
                    <option value="da">Dansk</option><option value="de">Deutsch</option><option value="en">English</option>
                    <option value="es">Español</option><option value="fi">Suomi</option><option value="fl">Vlaams</option>
                    <option value="fr">Français</option><option value="hi">हिन्दी</option><option value="id">Bahasa Indonesia</option>
                    <option value="it">Italiano</option><option value="ja">日本語</option><option value="ko">한국어</option>
                    <option value="lb">Lëtzebuergesch</option><option value="ms">Bahasa Melayu</option><option value="nl">Nederlands</option>
                    <option value="no">Norsk</option><option value="pl">Polski</option><option value="pt">Português</option>
                    <option value="ru">Русский</option><option value="sv">Svenska</option><option value="th">ไทย</option>
                    <option value="tr">Türkçe</option><option value="tw">繁體中文</option><option value="ur">اردو</option>
                    <option value="vi">Tiếng Việt</option><option value="yue">粵語</option><option value="zh">简体中文</option>
                </select>
            </label>
        </header>

        <section class="mb-8 max-w-3xl">
            <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-blue-300">OpenFireMap.org</p>
            <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl" data-i18n="version_hub_title">Software-Versionen</h1>
            <p class="mt-3 text-base leading-7 text-slate-300" data-i18n="version_hub_intro">Aktuelle Version und zentrale Links zu Änderungen und Projektinformationen.</p>
        </section>

        <section class="mb-5 rounded-2xl border border-blue-400/30 bg-blue-400/10 p-6 sm:p-8" aria-labelledby="current-version-title">
            <p class="text-sm font-semibold uppercase tracking-wide text-blue-200" id="current-version-title" data-i18n="version_hub_current">Aktuelle Software-Version</p>
            <p class="mt-3 font-mono text-4xl font-bold text-white" id="current-version">–</p>
        </section>

        <section class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <a class="ofm-version-card" href="https://github.com/FrnkMrz/OpenFireMapV2/releases" target="_blank" rel="noopener noreferrer">
                <h2 data-i18n="version_hub_releases">Veröffentlichungen auf GitHub</h2>
            </a>
            <a class="ofm-version-card" href="https://github.com/FrnkMrz/OpenFireMapV2/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer">
                <h2 data-i18n="version_hub_changelog">Änderungsprotokoll</h2>
            </a>
            <a class="ofm-version-card" href="https://github.com/FrnkMrz/OpenFireMapV2" target="_blank" rel="noopener noreferrer">
                <h2 data-i18n="version_hub_source">Quellcode und Projektdoku</h2>
            </a>
            <a class="ofm-version-card" href="/symbols/">
                <h2 data-i18n="symbols_page_link">Kartenzeichen</h2>
            </a>
            <a class="ofm-version-card sm:col-span-2" href="/status/">
                <h2 data-i18n="pipeline_status_link">Datenstatus</h2>
            </a>
        </section>
    </main>
    <script type="module" src="/src/js/version-page.js"></script>
</body>
</html>
